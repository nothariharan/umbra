<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Requests</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="requests" data-minor-units="2">
  <header>
    <span data-testid="current-user"></span>
    <span data-testid="current-handle"></span>
    <button type="button" data-testid="logout-button">Log out</button>
    <div data-testid="wallet-available" data-amount="0">0.00 EUR</div>
    <div data-testid="wallet-balance" data-amount="0">0.00 EUR</div>
  </header>
  <main>
    <section>
      <h2>Incoming</h2>
      <div data-testid="incoming-list"></div>
    </section>
    <section>
      <h2>Outgoing</h2>
      <div data-testid="outgoing-list"></div>
    </section>
    <div data-testid="empty-requests" class="empty-marker">&nbsp;</div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
