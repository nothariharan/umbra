<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="login">
  <form data-testid="login-form">
    <input data-testid="login-email" type="email" required>
    <input data-testid="login-password" type="password" required>
    <button type="submit" data-testid="login-submit">Log in</button>
  </form>
  <div data-testid="auth-error" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
