<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signup</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="signup">
  <form data-testid="signup-form">
    <input data-testid="signup-email" type="email" required>
    <input data-testid="signup-password" type="password" required>
    <input data-testid="signup-display-name" required>
    <button type="submit" data-testid="signup-submit">Sign up</button>
  </form>
  <script src="/static/app.js"></script>
</body>
</html>
