<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Requests</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="requests" data-minor-units="2">
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/requests">Requests</a>
    <a href="/authorizations">Authorizations</a>
    <a href="/split">Split</a>
  </nav>
  <header>
    <div class="topbar">
      <div class="who">
        <span data-testid="current-user"></span>
        <span data-testid="current-handle"></span>
      </div>
      <button type="button" data-testid="logout-button">Log out</button>
    </div>
    <div class="wallet compact">
      <div class="wallet-label">Available</div>
      <div class="wallet-headline" data-testid="wallet-available" data-amount="0">0.00 EUR</div>
      <div data-testid="wallet-balance" data-amount="0">0.00 EUR</div>
    </div>
  </header>
  <main>
    <h1 class="page-title">Requests</h1>
    <section class="card">
      <h2>Incoming</h2>
      <div data-testid="incoming-list"></div>
    </section>
    <section class="card">
      <h2>Outgoing</h2>
      <div data-testid="outgoing-list"></div>
    </section>
    <div data-testid="empty-requests" class="empty-marker">&nbsp;</div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
